{% extends "base.html" %}
{% block title %}{{ mode_copy.title }} | NOI 错题诊断{% endblock %}
{% block content %}
<section class="hero-card">
  <div class="hero-copy">
    <p class="eyebrow">{{ mode_copy.eyebrow }}</p>
    <h1>{{ mode_copy.title }}</h1>
    <p>{{ mode_copy.description }}</p>
  </div>
  <form class="panel form-panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">
      <span>当前学生</span>
      <input type="text" value="{{ student.nickname }}" disabled>
    </label>
    <label class="field">
      <span>题目链接</span>
      <input type="url" name="problem_url" maxlength="500" required placeholder="http://noi.openjudge.cn/ch0107/01/" value="{{ form_data.problem_url if form_data else '' }}">
    </label>
    <label class="field">
      <span>C++ 代码</span>
      <textarea name="code_text" rows="18" required placeholder="#include <bits/stdc++.h>">{{ form_data.code_text if form_data else '' }}</textarea>
    </label>
    <div class="panel-actions">
      <button class="primary-button" type="submit">{{ mode_copy.submit_label }}</button>
      <a class="text-link" href="{{ url_for('student.submission_new') }}">返回选择</a>
    </div>
  </form>
</section>
{% endblock %}
