{% extends "base.html" %}
{% block title %}学生登录 | NOI 错题诊断{% endblock %}
{% block content %}
<section class="auth-shell">
  <form class="panel card bg-base-100 border border-base-300 auth-panel" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="eyebrow">学生端</p>
    <h1>登录</h1>
    <label class="field fieldset">
      <span>用户名</span>
      <input class="input" type="text" name="nickname" required value="{{ nickname if nickname else '' }}">
    </label>
    <label class="field fieldset">
      <span>密码</span>
      <input class="input" type="password" name="password" required>
    </label>
    <button class="btn btn-primary" type="submit">进入学生端</button>
  </form>
</section>
{% endblock %}
