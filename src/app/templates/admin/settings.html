{% extends "base.html" %}
{% block title %}系统设置 | NOI 错题诊断{% endblock %}
{% block content %}
<section class="panel card bg-base-100 border border-base-300">
  <div class="panel-header">
    <div>
      <p class="eyebrow">教师后台</p>
      <h1>系统设置</h1>
    </div>
    <div class="panel-actions">
      <a class="btn btn-outline btn-sm" href="{{ url_for('admin.submission_list') }}">提交列表</a>
      <a class="btn btn-outline btn-sm" href="{{ url_for('admin.student_list') }}">学生管理</a>
      <form method="post" action="{{ url_for('admin.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-outline btn-sm" type="submit">退出</button>
      </form>
    </div>
  </div>

  <form class="form-panel form-inline" method="post" action="{{ url_for('admin.update_ai_model') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="hero-copy compact-copy">
      <p class="eyebrow">AI 模型</p>
      <p>当前：<strong>{{ active_ai_model }}</strong></p>
    </div>
    <label class="field fieldset">
      <span>选择模型</span>
      <select class="select" name="model_name">
        {% for model_name in allowed_ai_models %}
          <option value="{{ model_name }}" {% if model_name == active_ai_model %}selected{% endif %}>{{ model_name }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="btn btn-primary" type="submit">保存设置</button>
  </form>

  <form class="form-panel" method="post" action="{{ url_for('admin.update_ai_prompts') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="hero-copy compact-copy">
      <p class="eyebrow">AI 提示词</p>
      <p>这里只配置老师和学生传给 DeepSeek 的系统提示词，题目、输入输出和代码仍由系统自动拼接。</p>
    </div>
    <label class="field fieldset">
      <span>老师系统提示词</span>
      <textarea class="textarea" name="teacher_system_prompt" rows="12" required>{{ teacher_system_prompt }}</textarea>
    </label>
    <label class="field fieldset">
      <span>学生系统提示词</span>
      <textarea class="textarea" name="student_system_prompt" rows="14" required>{{ student_system_prompt }}</textarea>
    </label>
    <button class="btn btn-primary" type="submit">保存提示词</button>
  </form>
</section>
{% endblock %}
