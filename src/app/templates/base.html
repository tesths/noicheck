<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}NOI 错题诊断{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap header-content">
        <a class="brand" href="{{ url_for('public.submit') }}">NOI 错题诊断</a>
        <nav class="header-nav">
          <a href="{{ url_for('public.submit') }}">学生提交</a>
          <a href="{{ url_for('admin.submission_list') }}">教师后台</a>
        </nav>
      </div>
    </header>

    <main class="wrap page-shell">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <section class="flash-stack">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </section>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
