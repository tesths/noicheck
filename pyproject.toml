[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noi-diagnosis"
version = "0.1.0"
description = "NOI OpenJudge student submission diagnosis system"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0,<4.0",
  "Flask-Login>=0.6,<1.0",
  "Flask-Migrate>=4.0,<5.0",
  "Flask-SQLAlchemy>=3.1,<4.0",
  "Flask-WTF>=1.2,<2.0",
  "beautifulsoup4>=4.12,<5.0",
  "httpx>=0.27,<1.0",
  "openai>=1.30,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "redis>=5.0,<6.0",
  "rq>=2.1,<3.0",
  "tenacity>=9.0,<10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
